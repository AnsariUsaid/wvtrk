# Run the whole app: docker compose up --build, then open http://localhost:8080
name: windsight

services:
  api:
    build:
      context: ./backend
      target: runtime
    ports:
      - "8000:8000"
    environment:
      # Read from .env next to this file (see .env.example); chat is off without a key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
